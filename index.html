<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>me2room – Der Tisch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#121315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="me2room">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Raum Bes2Play: warmweiße Wand, Eichen-Lamellen, flaschengrüne Stühle, Messinglampen, rote LED, schwarzer Pokertisch mit weißem LED-Ring */
  --bg:#EFE9DF; --surface:#FBF8F2; --ink:#1E2120; --muted:#6E6A61; --line:#DDD3C3;
  --felt:#1F3B33; --felt-2:#2F5A4D; --brass:#B8913E; --brass-soft:#EBDDB9;
  --rim:#121315; --cloth:#24262F; --ringled:#F4F6F8; --oak:#C9A26A; --slat:#1A1A1A; --led:#E5283F; --amber:#F2B35E;
  --free:#BDB5A6; --warn:#C8243A; --on-felt:#F4EEDF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141615; --surface:#1D201F; --ink:#F1E8D8; --muted:#A59E90; --line:#313533;
    --felt:#24463C; --felt-2:#346656; --brass:#D9A954; --brass-soft:#3F3420;
    --rim:#0A0B0C; --cloth:#20222B; --ringled:#EEF1F4; --oak:#B88F55; --slat:#0F100F; --led:#FF2D4A; --amber:#F5B862;
    --free:#454A47; --warn:#FF3B53; --on-felt:#F4EEDF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1D201F; --ink:#F1E8D8; --muted:#A59E90; --line:#313533;
  --felt:#24463C; --felt-2:#346656; --brass:#D9A954; --brass-soft:#3F3420;
  --rim:#0A0B0C; --cloth:#20222B; --ringled:#EEF1F4; --oak:#B88F55; --slat:#0F100F; --led:#FF2D4A; --amber:#F5B862;
  --free:#454A47; --warn:#FF3B53; --on-felt:#F4EEDF; color-scheme:dark;
}
:root{--host:#2BD94F;--host-ink:#06290F;--guest:#FF9F1A;--guest-ink:#2A1600;--stop:#F23A3A;--stop-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--host:#3BEA62;--host-ink:#06290F;--guest:#FFAA2E;--guest-ink:#2A1600;--stop:#FF4545;--stop-ink:#FFFFFF}}
:root[data-theme="dark"]{--host:#3BEA62;--host-ink:#06290F;--guest:#FFAA2E;--guest-ink:#2A1600;--stop:#FF4545;--stop-ink:#FFFFFF}
:root{--mark:#2F8CFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mark:#4DA3FF}}
:root[data-theme="dark"]{--mark:#4DA3FF}
:root{--bubble:#DDEFD3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bubble:#20372B}}
:root[data-theme="dark"]{--bubble:#20372B}
.btn-mark{display:grid;gap:2px;background:transparent;color:var(--mark);border:1.5px solid var(--mark)}
.btn-mark small{font-size:12px;font-weight:500;opacity:.85}
.btn-mark{padding:12px 16px;font-size:17px}
.mk-top{display:flex;align-items:center;justify-content:center;gap:10px}
.mk-n{min-width:30px;height:30px;padding:0 8px;border-radius:999px;display:inline-grid;place-items:center;background:var(--mark);color:#fff;font:700 17px/1 "Zilla Slab",serif;font-variant-numeric:tabular-nums}
.btn-mark.on .mk-n{background:#fff;color:var(--mark)}
/* Vormerken – kompakt und edel */
.mark2{justify-self:center;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 18px;border-radius:999px;border:1.5px solid var(--mark);background:linear-gradient(180deg,color-mix(in srgb,var(--mark) 18%,transparent),color-mix(in srgb,var(--mark) 6%,transparent));color:#CFE4FF;font:600 16px/1 Figtree,sans-serif;letter-spacing:.2px;transition:background .2s,box-shadow .2s}
.mark2 .m2-i{font-size:18px;color:var(--mark)}
.mark2 .m2-n{min-width:34px;height:34px;padding:0 10px;border-radius:999px;display:inline-grid;place-items:center;background:var(--mark);color:#fff;font:700 17px/1 "Zilla Slab",serif;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.mark2.on{background:linear-gradient(180deg,#4DA3FF,#1F6FE0);color:#fff;box-shadow:0 0 18px -2px var(--mark)}
.mark2.on .m2-i{color:var(--guest);text-shadow:0 0 6px rgba(0,0,0,.35)}
.mark2.on .m2-n{background:#fff;color:#1F6FE0}
@media (prefers-reduced-motion:reduce){.mark2{transition:none}}
.btn-mark.on{background:var(--mark);color:#fff;animation:markglow 2s ease-in-out infinite}
@keyframes markglow{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--mark) 35%,transparent),0 0 14px var(--mark)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--mark) 20%,transparent),0 0 28px var(--mark)}}
@media (prefers-reduced-motion:reduce){.btn-mark.on{animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--mark) 30%,transparent),0 0 20px var(--mark)}}
.btn-stop{background:var(--stop);color:var(--stop-ink);box-shadow:0 4px 14px -6px var(--stop)}
.btn-guest{background:var(--guest);color:var(--guest-ink);box-shadow:0 0 0 1px color-mix(in srgb,var(--guest) 70%,#000) inset}
.btn-host{background:var(--host);color:var(--host-ink);box-shadow:0 0 0 1px color-mix(in srgb,var(--host) 70%,#000) inset,0 4px 14px -6px var(--host)}
.waitpos{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:14px;border-radius:14px;background:var(--rim);color:var(--on-felt);box-shadow:inset 0 0 0 1.5px var(--guest)}
.waitpos b{grid-row:span 2;grid-column:2;grid-row-start:1;font:700 28px/1 "Zilla Slab",serif;color:var(--guest);white-space:nowrap}
.waitpos .s{font-size:13px;opacity:.8}
.waitcount{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.waitcount span{font-weight:600}
.waitcount b{font:700 30px/1 "Zilla Slab",serif;color:var(--guest);font-variant-numeric:tabular-nums}
.wc-row{display:flex;align-items:stretch;gap:10px;margin-top:14px}
.wc-row .waitcount{flex:0 0 72%;margin:0;padding:8px 12px}
.wc-row .waitcount span{font-size:14px}
.wc-row .waitcount b{font-size:22px}
.btn-cancel{flex:1 1 auto;border-radius:12px;border:1.5px solid var(--stop);background:transparent;color:var(--stop);font:700 13px/1 Figtree,sans-serif;padding:0 8px;cursor:pointer}
.btn-cancel:active{background:color-mix(in srgb,var(--stop) 18%,transparent)}
.cd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--rim);color:var(--on-felt);box-shadow:inset 0 0 0 1.5px var(--brass)}
.cd-l{font-size:13px;opacity:.85}
.cd-v{font:700 26px/1 "Zilla Slab",serif;font-variant-numeric:tabular-nums;color:var(--brass);white-space:nowrap}
.cd.live .cd-v{color:var(--host)}
.lg{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-right:6px;vertical-align:-3px;font-size:11px;line-height:1}
.lg-h{background:var(--host)}
.lg-g{background:var(--guest)}
:root{--player:#EFE3C6;--player-ink:#2B2416}
.lg-p{background:var(--player);box-shadow:inset 0 0 0 1.5px var(--brass)}
.av.p{background:var(--guest);color:var(--guest-ink)}
.seat-p .halo{display:none}
.lg-f{background:var(--stop)}
.seat .halo{filter:blur(4px);opacity:.5}
.seat-h .halo,.seat-g .halo{display:none}
.seat-f .halo{animation:me2blink 1s ease-in-out infinite}
.seat-f .fcore{animation:me2core 1s ease-in-out infinite}
@keyframes me2blink{0%,100%{opacity:.9}50%{opacity:.12}}
@keyframes me2core{0%,100%{opacity:1}50%{opacity:.72}}
@media (prefers-reduced-motion:reduce){.seat-h .halo,.seat-h .core,.seat-f .halo,.seat-f .fcore{animation:none}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--slat)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

header{color:var(--on-felt);padding:22px 20px 20px;position:relative;overflow:hidden;
  background:radial-gradient(120px 90px at 88% 18%,color-mix(in srgb,var(--amber) 55%,transparent),transparent 70%),linear-gradient(180deg,rgba(10,10,10,.55),rgba(10,10,10,.78)),repeating-linear-gradient(90deg,var(--oak) 0 7px,var(--slat) 7px 9px);
  box-shadow:0 2px 0 var(--led),0 8px 22px -6px var(--led)}
header h1,header p,.me{position:relative;text-shadow:0 1px 8px rgba(0,0,0,.6)}
header h1{font:700 30px/1 "Zilla Slab",Georgia,serif;margin:0;letter-spacing:.2px}
header p{margin:6px 0 0;font-size:14px;opacity:.85}
header .suit{position:absolute;right:-6px;top:-18px;font-size:120px;line-height:1;opacity:.12;pointer-events:none;color:var(--led)}
.strip{margin-top:6px}
.me{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--brass);color:#1b1b1b;display:grid;place-items:center;font-weight:700;font-size:12px}

.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 6px;scroll-snap-type:x proximity}
.day{flex:0 0 64px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px 10px;text-align:center}
.day .wd{font-size:12px;color:var(--muted)}
.day .dn{font:700 22px/1.1 "Zilla Slab",serif}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:6px}
.day .dots i{width:7px;height:7px;border-radius:50%;background:var(--free)}
.day .dots i.on{background:var(--host)}
.day[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
.day[aria-pressed="true"] .wd{color:var(--on-felt);opacity:.8}
.legend{padding:0 20px;font-size:12px;color:var(--muted)}

section.panel{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ptitle h2{font:700 22px/1.2 "Zilla Slab",serif;margin:0}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-free{background:var(--line);color:var(--muted)}
.b-plan{background:var(--brass-soft);color:var(--ink)}
.b-table{background:var(--felt);color:var(--on-felt)}
.b-full{background:var(--warn);color:#fff}

.tablewrap{margin:12px auto 4px;max-width:360px}
.tablewrap svg{width:100%;height:auto;display:block}
.count{display:flex;gap:18px;justify-content:center;font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-size:18px}

h3{font:700 17px/1.3 "Zilla Slab",serif;margin:18px 0 8px}
.host{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.host:first-of-type{border-top:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.av.h{background:var(--host);color:var(--host-ink)}
.av.g{background:var(--felt-2);color:var(--on-felt)}
.host .n{font-weight:600}
.host .s{font-size:13px;color:var(--muted)}
.host .slot{font-size:13px;text-align:right;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:6px 0}

.actions{display:grid;gap:8px;margin-top:16px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;text-align:center}
.btn-main{background:var(--felt);color:var(--on-felt)}
.btn-brass{background:var(--brass);color:#1b1b1b}
.btn-line{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.form{display:grid;gap:10px;margin-top:12px;padding:14px;border-radius:14px;background:var(--bg)}
.form label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.form select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--felt);color:var(--on-felt);border-color:var(--felt)}

.feed{list-style:none;margin:0;padding:0;font-size:14px}
.feed li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);white-space:nowrap;font-size:13px;min-width:44px}

.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .s{font-size:13px;color:var(--muted)}
input.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.prose p{margin:0 0 10px}
.prose ol{padding-left:20px;margin:0 0 10px}

.wait{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;background:var(--bg)}
.wchip .av{width:26px;height:26px;font-size:11px}
.lounge{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:14px;color:var(--muted)}
.rank{display:grid;grid-template-columns:34px 36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank .pos{font:700 20px/1 "Zilla Slab",serif;text-align:center;color:var(--muted)}
.rank.top .pos{color:var(--brass)}
.rank .pts{font:700 20px/1 "Zilla Slab",serif}
.rank.me{background:var(--brass-soft);border-radius:12px;padding-left:6px;padding-right:6px}
.bust{display:grid;gap:6px;margin-top:8px}
.bust button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left}
.bust button:disabled{cursor:default}
.bust button .av{width:30px;height:30px;font-size:12px}
.bust .out{opacity:.5;text-decoration:line-through}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable td{padding:6px 0;border-top:1px solid var(--line)}
.ptable td:last-child{text-align:right;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:10px 2px 12px;font-size:clamp(10.5px,3vw,12px);white-space:nowrap;color:var(--muted);display:grid;gap:2px;justify-items:center}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--felt);font-weight:700}
@media (prefers-color-scheme:dark){nav.tabs button[aria-current="page"]{color:var(--brass)}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:6}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* Geber */
.dealerline{text-align:center;font-size:14px;color:var(--muted);margin:8px 0 0}
.dealerline b{color:var(--ink)}
/* WhatsApp-Erinnerung */
.remind .ptitle h3{margin:0}
.rstate{font-size:15px;margin:8px 0 0}
.rmeta{font-size:12px;color:var(--muted);margin:10px 0 0}
.bubble{position:relative;margin-top:6px;padding:10px 12px 20px;border-radius:14px 14px 14px 4px;background:var(--bubble);color:var(--ink);white-space:pre-line;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.bubble time{position:absolute;right:10px;bottom:4px;font-size:11px;color:var(--muted)}
/* Mein Profil */
.pf-head{display:flex;align-items:center;gap:14px}
.pf-head>div:last-child{min-width:0}
.pf-no{flex:0 0 auto;padding:12px 14px;border-radius:14px;background:var(--rim);color:var(--brass);font:700 28px/1 "Zilla Slab",serif;text-align:center;box-shadow:inset 0 0 0 1.5px var(--brass);font-variant-numeric:tabular-nums}
.pf-head h2{font:700 24px/1.2 "Zilla Slab",serif;margin:0;overflow-wrap:anywhere}
.pf-head .s{font-size:13px;color:var(--muted)}
.pf-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.pf-stat{padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.pf-stat b{display:block;font:700 28px/1.1 "Zilla Slab",serif;font-variant-numeric:tabular-nums}
.pf-stat span{font-size:13px;color:var(--muted)}
.pf-res{flex-wrap:wrap}
.pf-res .grow{flex:1 1 160px}
.pf-res .btns{display:flex;gap:6px}
.pf-res .btns .btn{padding:9px 14px}
/* Anmeldung */
.login{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none}
.login.show{display:block}
.login .box{max-width:400px;margin:0 auto;padding:0 16px 40px}
.login header{margin:0 -16px 20px}
.login h2{font:700 24px/1.2 "Zilla Slab",serif;margin:0 0 6px}
.login .form{background:var(--surface);border:1px solid var(--line);padding:18px;gap:12px}
.login input.big{font:700 28px/1 "Zilla Slab",serif;letter-spacing:6px;text-align:center;padding:14px}
.login header.lg-hd{padding:34px 16px 26px;text-align:center;box-shadow:0 2px 0 var(--led),0 12px 30px -6px var(--led)}
.login .neon-big{justify-content:center;font-size:54px;gap:3px}
.login .neon-big .nchip{width:58px;height:58px;margin:0 5px}
.login .neon-big .nchip::before{inset:4px;border-width:5px}
.login .neon-big .nchip span{font-size:32px}
.lg-suits{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:18px;color:#FFE9EC;opacity:.75;text-shadow:0 0 6px rgba(255,255,255,.5)}
.lg-suits .r{color:#FF6F82;text-shadow:0 0 8px #FF2D4A}
.login h2,.login #loginbody>.empty{text-align:center}
.login input.big::placeholder{font:600 20px/1.4 Figtree,sans-serif;letter-spacing:1px;color:rgba(244,238,223,.45)}
.login .err{color:var(--warn);font-weight:600;font-size:14px;margin:0;min-height:20px}
.adm-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adm-row .nrb{font:700 18px/1 "Zilla Slab",serif;color:var(--brass);font-variant-numeric:tabular-nums}
.adm-row .s{font-size:13px;color:var(--muted)}
.adm-row .btn{padding:8px 10px;font-size:13px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--host);margin-left:6px;vertical-align:1px}
.syncdot.off{background:var(--stop)}
/* Raum als Hintergrund: Eichen-Lamellen, warmes Licht, rote LED-Leiste */
:root{--room:radial-gradient(260px 200px at 90% 6%,color-mix(in srgb,var(--amber) 45%,transparent),transparent 70%),linear-gradient(180deg,rgba(10,10,10,.62),rgba(10,10,10,.8)),repeating-linear-gradient(90deg,var(--oak) 0 7px,var(--slat) 7px 9px)}
body{background:var(--slat);background-image:var(--room);background-attachment:fixed}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:3px;background:var(--led);box-shadow:0 0 18px 4px var(--led);z-index:4;pointer-events:none}
header{background:transparent}
.login{background:var(--slat);background-image:var(--room)}
.login h2,.login>.box>#loginbody>.empty{color:var(--on-felt)}
.login #loginbody>.empty{opacity:.85}
.login #loginbody>h2,.login #loginbody>p{text-shadow:0 1px 8px rgba(0,0,0,.6)}
.login .form{color:var(--ink)}
nav.tabs{bottom:3px}
.toast{bottom:96px}
/* Monatskalender */
.cal{margin:14px 16px 0;padding:14px 12px 10px;border-radius:20px;background:rgba(8,8,8,.62);color:var(--on-felt);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brass) 70%,transparent)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.cal-h b{font:700 20px/1 "Zilla Slab",serif;color:var(--brass)}
.cal-nav{width:36px;height:36px;border-radius:50%;border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);background:transparent;color:var(--on-felt);font-size:20px;line-height:1}
.cal-nav:disabled{opacity:.25}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 4px}
.cal-wd{text-align:center;font-size:11px;opacity:.7;padding-bottom:2px}
.cal-d{display:grid;justify-items:center;align-content:center;gap:5px;min-height:56px;padding:6px 0 7px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:inherit;min-width:0}
.cal-d.off{opacity:.3;border-color:transparent;background:transparent}
.cal-d{position:relative}
.cal-mk{position:absolute;top:-5px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--mark);color:#fff;font:700 11px/17px Figtree,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(8,8,8,.9)}
.cal-n{font:700 15px/1 "Zilla Slab",serif;font-variant-numeric:tabular-nums}
.cal-dots{display:grid;grid-template-columns:repeat(5,5px);gap:2px}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18)}
.cal-dots i.h{background:var(--host)}
.cal-dots i.g{background:var(--guest)}
.cal-d.run{border-color:var(--host);box-shadow:0 0 0 1px var(--host),0 0 10px -2px var(--host)}
.cal-d.today .cal-n{color:var(--brass)}
.cal-d.sel{background:var(--brass);color:#1b1b1b;border-color:var(--brass)}
.cal-d.sel .cal-dots i:not(.h):not(.g){background:rgba(0,0,0,.2)}
.cal-lg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;margin:10px 0 0;font-size:11.5px;opacity:.9}
.lg-o{background:rgba(255,255,255,.25)}
.lg-run{background:transparent;box-shadow:0 0 0 2px var(--host)}
/* Edle dunkle Karten wie der Raum am Abend */
section.panel,details.panel,nav.tabs,.login .form{
  --ink:#F4EEDF; --muted:#B9AF9C; --line:rgba(244,238,223,.14); --bg:rgba(255,255,255,.06); --surface:rgba(255,255,255,.04);
  --brass-soft:rgba(217,169,84,.22);
  color:var(--ink);
}
section.panel,details.panel{background:linear-gradient(180deg,rgba(22,22,24,.86),rgba(12,12,14,.9));border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);box-shadow:0 10px 30px -12px rgba(0,0,0,.8)}
.ptitle h2{color:var(--brass)}
select{color-scheme:dark}
select option{background:#1C1B1F;color:#F4EEDF}
.hostcard{border:1px solid color-mix(in srgb,var(--host) 55%,transparent);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 22px -10px var(--host)}
.hostcard,.hc-body{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.hc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hc-head h3{margin:0;font:700 19px/1.2 "Zilla Slab",serif;color:var(--host)}
.hc-date{font-size:13px;color:var(--muted);white-space:nowrap}
.hc-seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hc-chip{display:grid;gap:3px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18)}
.hc-chip span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hc-chip b{font:700 18px/1 "Zilla Slab",serif;color:var(--ink)}
.hc-chip.h.on{border-style:solid;border-color:var(--host);background:color-mix(in srgb,var(--host) 14%,transparent);box-shadow:0 0 14px -3px var(--host)}
.hc-chip.h.on b{color:var(--host)}
.hc-chip.g.on{border-style:solid;border-color:var(--guest);background:color-mix(in srgb,var(--guest) 16%,transparent);box-shadow:0 0 16px -2px var(--guest)}
.hc-chip.g.on b{color:var(--guest);text-shadow:0 0 8px color-mix(in srgb,var(--guest) 70%,transparent)}
.hc-hint{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.hc-hint:empty{display:none}
.hc-info{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-weight:600}
.tf{display:grid;gap:6px;min-width:0}
.tf-l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tf-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tf select,.tf input{width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid rgba(244,238,223,.18);background:rgba(255,255,255,.07);color:var(--ink);font:600 15px Figtree,sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(244,238,223,.14)}
.seg button{padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:700 14px Figtree,sans-serif;cursor:pointer;opacity:.7}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1b1b1b;opacity:1;box-shadow:0 2px 10px -3px var(--brass)}
details.setup .hc-body{padding:0 0 14px}
.tcenter{cursor:pointer;outline:none}
.tcenter:focus-visible{stroke:#8DB6FF;stroke-width:2}
.hc-sub{display:block;font-size:12px;font-weight:500;color:#8DB6FF;margin-top:3px}
.tourcard{border-color:color-mix(in srgb,#4D8DFF 60%,transparent);box-shadow:0 0 22px -10px #3B7BFF}
.tourcard .hc-head h3{color:#8DB6FF}
.sg-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.sg-row .grow{display:grid;gap:3px;min-width:0}
.sg-row b{font-size:14px}.sg-row span{font-size:12px;color:var(--muted)}
.vbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:2px 0}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,#3B7BFF,var(--host))}
.glow-g{color:var(--host)!important;font-weight:700;text-shadow:0 0 8px color-mix(in srgb,var(--host) 80%,transparent),0 0 16px color-mix(in srgb,var(--host) 45%,transparent)}
.btn-pair{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px}
.btn-pair .btn{padding-left:8px;padding-right:8px;font-size:14px;white-space:nowrap}
.lockinfo{border:1px solid color-mix(in srgb,var(--brass) 60%,transparent)}
.sg-take{padding:8px 12px;font-size:13px;flex:0 0 auto}
.seatsheet .btn-guest{box-shadow:0 0 18px -3px var(--guest),inset 0 0 0 1px rgba(255,255,255,.15)}
.dealercard{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent)}
.dealercard .hc-head h3{color:var(--brass)}
details.setup{margin:12px 0 0;border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:12px;padding:0 12px}
details.setup summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--brass);display:flex;justify-content:space-between;gap:8px;list-style:none}
details.setup summary::-webkit-details-marker{display:none}
details.setup summary span{font-weight:600;font-size:13px;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.setup .form{margin:0 0 12px}
.mk-row{margin:-3px 0 2px}
.mark3{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 4px 0 0;border:0;border-radius:999px;background:transparent;color:#5C9BFF;font:700 9px/1 Figtree,sans-serif;letter-spacing:.3px;cursor:pointer;
  box-shadow:none;text-shadow:0 0 6px rgba(120,170,255,.9)}
.mark3 .m3-i{display:inline-block;font-size:15px;line-height:1;color:#4D8DFF;text-shadow:0 0 6px #3B7BFF,0 0 12px #3B7BFF,0 0 22px #2F6BFF}
.mark3 .mk-timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--host);text-shadow:0 0 6px color-mix(in srgb,var(--host) 80%,transparent)}
nav.tabs{background:rgba(12,12,14,.94);border-top:1px solid color-mix(in srgb,var(--brass) 45%,transparent);backdrop-filter:blur(6px)}
nav.tabs button{font-size:13px;padding:10px 2px 12px}
nav.tabs button span{font-size:22px}
nav.tabs button[hidden]{display:none}
nav.tabs button[aria-current="page"]{color:var(--brass)!important}
.login .form{background:linear-gradient(180deg,rgba(22,22,24,.9),rgba(12,12,14,.92));border:1px solid color-mix(in srgb,var(--brass) 55%,transparent)}
.login input.big,input.search,.form select{background:rgba(255,255,255,.08);border-color:rgba(244,238,223,.18);color:var(--ink)}
.form{background:rgba(255,255,255,.05)}
.btn-line{color:var(--ink)}
.b-free{background:rgba(255,255,255,.1);color:var(--muted)}
.b-plan{background:var(--brass);color:#1b1b1b}
.rank.me{background:rgba(217,169,84,.18)}
.chip{background:transparent;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);color:#1b1b1b;border-color:var(--brass)}
details.rules{padding:0 18px;margin:14px 16px 0;border-radius:20px}
details.rules summary{cursor:pointer;padding:16px 0;font:700 18px/1.2 "Zilla Slab",serif;color:var(--brass);list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:" ›";opacity:.7}
details.rules[open] summary::after{content:" ⌄"}
details.rules .prose{padding-bottom:16px}
.toast{background:var(--brass);color:#1b1b1b;font-weight:600}
/* Sachpreise vor einer edlen Bar-Rückwand */
section.prizebar{position:relative;overflow:hidden;border:2px solid var(--brass);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 14px 34px -12px rgba(0,0,0,.9),0 0 26px -8px #F2B35E;
  background:linear-gradient(180deg,rgba(10,8,6,.35),rgba(10,8,6,.15) 40%,rgba(10,8,6,.55)),var(--barbg) center/cover no-repeat,#120D0A}
section.prizebar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--led);box-shadow:0 0 14px 3px var(--led);pointer-events:none}
section.prizebar .ptitle h3{color:var(--brass);font:700 21px/1.2 "Zilla Slab",serif;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.barshelf{height:120px}
section.prizebar{background:linear-gradient(180deg,rgba(10,8,6,.1),rgba(10,8,6,0) 30%,rgba(10,8,6,.45) 75%,rgba(10,8,6,.7)),var(--barbg) center top/cover no-repeat,#120D0A}
.prizes{display:grid;gap:10px;margin-top:0}
.prize{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(14,12,10,.72),rgba(8,7,6,.82));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brass) 55%,transparent),0 6px 18px -8px rgba(0,0,0,.9);backdrop-filter:blur(2px)}
.prize.p1{box-shadow:inset 0 0 0 1.5px var(--brass),0 0 18px -6px #F2B35E,0 6px 18px -8px rgba(0,0,0,.9)}
.pz-m{font-size:28px;width:36px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.pz-t{font:700 17px/1.25 "Zilla Slab",serif;color:var(--ink)}
.prize .s{font-size:13px;color:var(--muted)}
section.prizebar .rmeta{position:relative;margin-top:12px;color:var(--on-felt);opacity:.8;text-shadow:0 1px 6px rgba(0,0,0,.9)}
section.prizebar .form{background:rgba(8,7,6,.82)}
/* ===== Kopf: Neon-Logo, Pokerchip, Casino-Anzeigetafel ===== */
.neon{margin:0;display:flex;align-items:center;gap:1px;font:700 26px/1 "Zilla Slab",Georgia,serif;letter-spacing:.2px;white-space:nowrap;flex:0 0 auto}
.hd-row{gap:8px}
.hd-me{flex:1 1 auto;justify-content:flex-end}
.mepill{max-width:none;flex:0 1 auto}
#mename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.neon .nx{color:#FFE9EC;text-shadow:0 0 2px #fff,0 0 6px #FF4D63,0 0 14px #FF2D4A,0 0 28px #FF2D4A,0 0 46px rgba(255,45,74,.7),0 3px 0 #7A111E;animation:neonOn 1.6s ease-out 1 both,neonHum 6s ease-in-out 1.6s infinite}
.nchip{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;margin:0 2px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FF6B7D,#C8102E 55%,#7A0A1C);
  box-shadow:inset 0 0 0 3px #7A0A1C,inset 0 0 0 5px rgba(255,255,255,.95),inset 0 0 0 9px #C8102E,0 3px 0 #4A0612,0 0 16px rgba(255,45,74,.75);
  animation:chipSpin 1.2s cubic-bezier(.2,.8,.2,1) .3s 1 both}
.nchip::before{content:"";position:absolute;inset:2px;border-radius:50%;border:3px dashed rgba(255,255,255,.95);opacity:.9}
.nchip span{position:relative;font:800 18px/1 "Zilla Slab",serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@keyframes neonOn{0%{opacity:.15}8%{opacity:1}12%{opacity:.3}18%{opacity:1}24%{opacity:.5}30%,100%{opacity:1}}
@keyframes neonHum{0%,92%,100%{opacity:1}94%{opacity:.82}96%{opacity:1}97%{opacity:.88}}
@keyframes chipSpin{0%{transform:rotateY(0) scale(.6);opacity:0}60%{opacity:1}100%{transform:rotateY(720deg) scale(1)}}
/* Spieler-Chip oben rechts */
.mepill{gap:8px;padding:4px 10px 4px 4px;background:linear-gradient(180deg,rgba(20,16,12,.9),rgba(8,7,6,.9))}
.mechip{flex:0 0 auto;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:800 10.5px/1 Figtree,sans-serif;font-style:normal;color:#1b1b1b;letter-spacing:.2px;
  background:radial-gradient(circle at 35% 30%,#F6D58E,#D9A954 55%,#8C6A2A);
  box-shadow:inset 0 0 0 2px #8C6A2A,inset 0 0 0 3.5px rgba(255,255,255,.85),inset 0 0 0 6px #D9A954,0 2px 0 #5A4219,0 0 10px -2px #F2B35E}
#mename{font:700 14px/1 "Zilla Slab",serif;color:var(--on-felt)}
.mechipw{position:relative;flex:0 0 auto;display:inline-grid}
.mechipw .syncdot{position:absolute;right:-2px;bottom:-1px;margin:0;width:9px;height:9px;box-shadow:0 0 0 2px #0A0908}
.mepill{gap:7px;padding:4px 11px 4px 4px}
/* Casino-Anzeigetafel */
.board{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 14px;border-radius:14px;
  background:linear-gradient(180deg,#141210,#060505);
  box-shadow:inset 0 0 0 1.5px var(--brass),inset 0 0 0 4px #0A0908,inset 0 0 0 5px color-mix(in srgb,var(--brass) 40%,transparent),0 6px 18px -6px rgba(0,0,0,.9),0 0 22px -8px #F2B35E}
.board::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,236,200,.18),transparent);animation:boardShine 4.5s ease-in-out 1s infinite;pointer-events:none}
@keyframes boardShine{0%{left:-80px}45%,100%{left:110%}}
.bd-live{display:inline-flex;align-items:center;gap:7px;font:800 11px/1 Figtree,sans-serif;letter-spacing:2px;color:var(--host);text-shadow:0 0 8px color-mix(in srgb,var(--host) 70%,transparent)}
.bd-num{display:inline-grid;place-items:center;min-width:54px;padding:4px 10px;border-radius:8px;background:#000;box-shadow:inset 0 0 0 1px rgba(242,179,94,.35),inset 0 2px 8px rgba(0,0,0,.9)}
.board .lv-n{font:700 26px/1 "Zilla Slab",serif;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#FFC062;text-shadow:0 0 6px rgba(255,170,60,.9),0 0 16px rgba(255,140,30,.6)}
.board .lv-n.up{color:#7CFF9A;text-shadow:0 0 6px rgba(80,255,130,.9),0 0 18px rgba(60,230,110,.6)}
.bd-lbl{font:800 13px/1 Figtree,sans-serif;letter-spacing:2.5px;color:var(--host);text-shadow:0 0 8px color-mix(in srgb,var(--host) 70%,transparent)}
.bd-suits{margin-left:auto;font-size:13px;letter-spacing:3px;color:var(--brass);opacity:.75}
@media (prefers-reduced-motion:reduce){.neon .nx,.nchip,.board::after{animation:none}}
/* Holzleiste mit eingebranntem Namen */
.plank{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding:10px 16px;border-radius:10px;
  background:
    repeating-linear-gradient(90deg,rgba(60,30,8,.10) 0 2px,transparent 2px 9px,rgba(255,235,200,.06) 9px 10px,transparent 10px 23px),
    repeating-linear-gradient(0deg,rgba(90,50,15,.18) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#D9B37A,#C49558 45%,#A97A40);
  box-shadow:inset 0 1px 0 rgba(255,240,210,.55),inset 0 -2px 4px rgba(70,35,8,.45),inset 0 0 0 1px rgba(70,35,8,.5),0 4px 12px -4px rgba(0,0,0,.8)}
.plank::before,.plank::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6D58E,#8C6A2A);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.plank::before{left:9px}.plank::after{right:9px}
.burn{font:700 21px/1.1 "Zilla Slab",Georgia,serif;letter-spacing:1.5px;color:#3A1806;
  text-shadow:0 1px 0 rgba(255,228,185,.55),0 0 1px #1A0902,0 0 5px rgba(90,35,5,.65),0 0 12px rgba(120,50,10,.35);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hd-row .plank{flex:1 1 auto;min-width:0;margin:0;padding:5px 16px;gap:6px;border-radius:8px}
.hd-row .plank::before{left:5px}.hd-row .plank::after{right:5px}
.hd-row .plank::before,.hd-row .plank::after{width:5px;height:5px;margin-top:-2.5px}
.hd-row .burn{display:flex;flex-direction:column;align-items:center;line-height:1.05;letter-spacing:.5px;min-width:0;max-width:100%}
.hd-row .burn b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hd-row .burn small{font-size:10px;letter-spacing:2px;opacity:.85}
.hd-row .plank .syncdot{position:absolute;right:12px;top:6px;width:6px;height:6px}
.plank .syncdot{margin:0;flex:0 0 auto;width:8px;height:8px;box-shadow:0 0 0 2px rgba(58,24,6,.6)}
/* Tafel: nächstes Spiel */
button.board{width:100%;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.board .bd-live{font-size:10.5px;letter-spacing:1.6px;white-space:nowrap}
.board .lv-n{font-size:21px;white-space:nowrap}
#live.board{display:grid;gap:6px;padding:8px 10px 10px}
#live .bd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;min-height:26px}
#live .bd-tog{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);background:rgba(0,0,0,.5);color:#FFC062;font:700 12px/1 Figtree,sans-serif;cursor:pointer}
#live .bd-tog i{font-style:normal;font-size:14px;transition:transform .25s}
#live .bd-tog[aria-expanded="true"] i{transform:rotate(180deg)}
#live .bd-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}
#live .bd-row:active{background:rgba(255,255,255,.05)}
#live .bd-num{flex:0 0 auto;min-width:0;padding:4px 7px}
#live .bd-num .lv-n{font-size:14px;letter-spacing:.3px}

<div class="toast" id="toast" role="status"></div>

<script>
/* ================= EINSTELLUNGEN – hier leicht änderbar ================= */
const WINTER_START  = "18:00";  // Startzeit im Winter
const SOMMER_START  = "19:00";  // Startzeit im Sommer (vorerst)
const ERINNERUNG_UM = "16:00";  // Uhrzeit der WhatsApp-Erinnerung am Spieltag
/* ======================================================================== */

const HOST_MAX=5, SEATS=10, GUESTS_PER_HOST=1, DAYS=14;
const VARIANTS=["Texas Hold’em","Omaha"];
const BLINDS=["1er Blind","2er Blind","4er Blind","5er Blind","10er Blind","25er Blind","50er Blind","100er Blind"];   // Start-Blind
const LEVELS=[10,15,20,30];                                    // Blinds steigen alle … Minuten
const blindOf=d=>BLINDS[d.blind??1], lvlOf=d=>d.lvl||20;
const turnierTxt=d=>`${VARIANTS[d.variant]} · ${d.start} Uhr · ${blindOf(d)}`;
const SUMMER_START=SOMMER_START;
const STARTS=[...new Set([WINTER_START,SUMMER_START,"18:00","19:00","20:00","21:00"])].sort();
const PLACE_PTS=[12,9,7,5,4,3,2,2,1,1];          // Turnierplätze 1–10 (Spieler-Rangliste)
const PLANER_PT=10, GUEST_PT=5;                  // Gastgeber-Rangliste: Abend übernommen, Gast war da
const BONUS_MAX=5;                               // Anwesenheit: 1 Punkt je Stunde, höchstens 5
// Sommerzeit automatisch erkennen: Im Sommer ist die Zeitverschiebung kleiner als im Winter
const stdOffset=y=>Math.max(new Date(y,0,1).getTimezoneOffset(),new Date(y,6,1).getTimezoneOffset());
const isWinter=d=>d.getTimezoneOffset()>=stdOffset(d.getFullYear());
const defStart=d=>isWinter(d)?WINTER_START:SUMMER_START;
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];

/* ================= Speicher (Supabase) ================= */
const SB_URL="https://psgykprwzninhiuakmls.supabase.co";
const SB_KEY="sb_publishable_kYOK1inhzgIbP_lg1a2Syw_XXCzayvU"; // öffentlicher Schlüssel, darf in der Seite stehen
async function rpc(fn,body){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("net "+r.status);
  return r.json();
}
let TOKEN=null; try{TOKEN=localStorage.getItem("me2room-token")}catch(e){}
const setToken=t=>{TOKEN=t;try{t?localStorage.setItem("me2room-token",t):localStorage.removeItem("me2room-token")}catch(e){}};
let ME=null, VERSION=0, ADMIN=null;

// Mitglieder kommen aus dem Speicher. Intern ist m = Nummer - 1.
let members=[]; const MEM={};
function setMembers(list){
  members=list.map(x=>({id:x.nr-1,name:x.nickname||String(x.nr).padStart(3,"0"),since:x.since,lead:x.lead,reg:!!x.nickname}));
  Object.keys(MEM).forEach(k=>delete MEM[k]); members.forEach(m=>MEM[m.id]=m);
}
const nm=m=>MEM[m]?MEM[m].name:"#"+String(m+1).padStart(3,"0");
const ini=m=>nm(m).split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const no=m=>"#"+String(m+1).padStart(3,"0");
const MAXNR=888;                                  // Spieler-Nummern 001 bis 888
const GEBER_MIN=901, GEBER_MAX=999;               // Kartengeber-Nummern 901 bis 999
const isGeber=m=>m!=null&&m+1>=GEBER_MIN;
const byGeber=n=>(Number.isInteger(n)&&n>=GEBER_MIN&&n<=GEBER_MAX&&MEM[n-1])?n-1:null;
const dreq=d=>{const q=d.dreq||(d.dreq=[]);for(let i=0;i<q.length;i++)if(typeof q[i]==="number")q[i]={m:q[i],at:0};return q};
const dreqHas=(d,m)=>dreq(d).some(x=>x.m===m);
const dreqSorted=d=>dreq(d).filter(x=>MEM[x.m]).slice().sort((a,b)=>(a.at||0)-(b.at||0));
const whenTxt=ts=>{if(!ts)return "früher";const t=new Date(ts);return `${t.getDate()}.${t.getMonth()+1}. um ${pad(t.getHours())}:${pad(t.getMinutes())} Uhr`};
const byNum=n=>(Number.isInteger(n)&&((n>=1&&n<=MAXNR)||(n>=901&&n<=999))&&MEM[n-1])?n-1:null;
const guestField=()=>`<label>Nummer deines Gastes (1–888)<input id="fguest" class="search" inputmode="numeric" placeholder="z. B. 42"></label><p class="empty" id="fguestname" style="margin:0">Leer lassen, wenn du den Gast später einträgst. Neuer Interessent ohne Nummer: 000 eingeben.</p>`;
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date(); today.setHours(0,0,0,0);
// buchbare Tage: ab heute bis Ende des nächsten Monats
const dates=(()=>{const end=new Date(today.getFullYear(),today.getMonth()+2,0),a=[];for(const d=new Date(today);d<=end;d.setDate(d.getDate()+1))a.push(new Date(d));return a})();
let calMonth=new Date(today.getFullYear(),today.getMonth(),1);
const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function monthCal(sel){
  const y=calMonth.getFullYear(),mo=calMonth.getMonth(),first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate();
  const lead=(first.getDay()+6)%7, minM=new Date(today.getFullYear(),today.getMonth(),1), maxM=new Date(today.getFullYear(),today.getMonth()+1,1);
  let h=`<div class="cal"><div class="cal-h"><button class="cal-nav" data-cal="-1" ${calMonth<=minM?"disabled":""} aria-label="Voriger Monat">‹</button><b>${MONL[mo]} ${y}</b><button class="cal-nav" data-cal="1" ${calMonth>=maxM?"disabled":""} aria-label="Nächster Monat">›</button></div>`;
  h+=`<div class="cal-g">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<span class="cal-wd">${w}</span>`).join("")}`;
  for(let i=0;i<lead;i++) h+=`<span></span>`;
  for(let n=1;n<=days;n++){
    const k=`${y}-${pad(mo+1)}-${pad(n)}`, d=S.days[k];
    if(!d){h+=`<span class="cal-d off"><span class="cal-n">${n}</span></span>`;continue}
    const ps=d.hosts.length, gs=takenSeats(d).length-ps, u=used(d);
    let dots="";for(let i=0;i<SEATS;i++)dots+=`<i class="${i<ps?"h":i<ps+gs?"g":""}"></i>`;
    const run=u>=6, done=d.result&&d.result.done;
    h+=`<button class="cal-d${run?" run":""}${k===sel?" sel":""}${k===key(today)?" today":""}" data-day="${k}" aria-pressed="${k===sel}" aria-label="${dateLabel(k)}: ${u} von ${SEATS} Plätzen belegt${run?", Runde findet statt":""}${done?", beendet":""}"><span class="cal-n">${n}</span><span class="cal-dots">${dots}</span>${d.interest.length?`<span class="cal-mk" title="${d.interest.length} vorgemerkt">${d.interest.length}</span>`:""}</button>`;
  }
  h+=`</div><p class="cal-lg"><span><i class="lg lg-h"></i>Gastgeber</span><span><i class="lg lg-g"></i>Gast</span><span><i class="lg lg-o"></i>frei</span><span><i class="lg lg-run"></i>Runde findet statt (ab 6)</span><span><i class="lg" style="background:var(--mark)"></i>vorgemerkt</span></p></div>`;
  return h;
}
// Ranglisten laufen pro Monat (Schlüssel "JJJJ-MM")
const curMon=key(today).slice(0,7);
const monLabel=mon=>{const [y,mo]=mon.split("-").map(Number);return `${MONL_[mo-1]} ${y}`};
const MONL_=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const quarter=monLabel(curMon);
const MP=mon=>S.points[mon]||{}, MPP=mon=>S.ppoints[mon]||{};
const persons=n=>n===1?"1 Person":`${n} Personen`;

// S = gemeinsamer Tisch (days, feed, points, stats) + eigene Ansicht (me, tab, sel)
const SHARED=["days","feed","points","ppoints","stats","prizes"];
let S={me:0,days:{},feed:[],tab:"kalender",sel:key(dates[0]),points:{},ppoints:{},stats:{},prizes:{}};
try{const p=JSON.parse(localStorage.getItem("me2room-view")||"{}");if(p.tab)S.tab=p.tab}catch(e){}
function fillDays(){
  // fehlende Tage ergänzen, alte Tage (älter als 60 Tage) aufräumen
  dates.forEach(dt=>{const k=key(dt);if(!S.days[k])S.days[k]={variant:0,start:defStart(dt),hosts:[],wait:[],interest:[],result:null}});
  const old=new Date(today);old.setDate(old.getDate()-60);const ok=key(old);
  Object.keys(S.days).forEach(k=>{if(k<ok)delete S.days[k]});
  if(!S.days[S.sel])S.sel=key(dates[0]);
  // beim ersten Öffnen: hat das Turnier heute schon begonnen, gleich den nächsten buchbaren Tag zeigen
  if(!fillDays.done){fillDays.done=true;const k0=key(dates[0]),d0=S.days[k0];if(S.sel===k0&&d0&&startedDay(k0,d0)&&dates[1]){S.sel=key(dates[1]);calMonth=new Date(dates[1].getFullYear(),dates[1].getMonth(),1)}}
}
function applyShared(st){
  st=st||{}; S.days=st.days||{}; S.feed=st.feed||[]; S.points=st.points||{}; S.ppoints=st.ppoints||{}; S.stats=st.stats||{}; S.prizes=st.prizes||{};
  // altes Format (ohne Monate) verwerfen
  [S.points,S.ppoints].forEach(o=>Object.keys(o).forEach(x=>{if(typeof o[x]!=="object")delete o[x]}));
  fillDays();
}
const sharedJSON=()=>JSON.stringify(SHARED.map(k=>S[k]));
const save=()=>{try{localStorage.setItem("me2room-view",JSON.stringify({tab:S.tab}))}catch(e){}};

const solo=d=>d.players||(d.players=[]);
const players=d=>[...d.hosts.flatMap(h=>[h.m,...h.guests]),...solo(d).map(p=>p.m)];
const active=d=>players(d).length>0;
const startTs=(k,d)=>new Date(`${k}T${d.start}:00`).getTime();
const startedDay=(k,d)=>!!d.result||Date.now()>=startTs(k,d);
const used=d=>players(d).length;
const freeGuestSlots=d=>d.hosts.filter(h=>h.guests.length<GUESTS_PER_HOST);
const takenSeats=d=>[...d.hosts.flatMap(h=>[h.seat,h.gseat]),...solo(d).map(p=>p.seat)];
const freeSeatList=d=>{const t=takenSeats(d);return [...Array(SEATS).keys()].filter(i=>!t.includes(i))};
const freeSeatCount=d=>SEATS-takenSeats(d).length;
const hasDealer=d=>d.dealer!=null&&MEM[d.dealer]!=null;
const pickInfo=()=>`<p class="empty" style="margin:0;color:var(--ink)"><b>Plätze wählen:</b> Tippe am Tisch auf einen roten Platz für dich, dann auf einen für deinen Gast.</p><p class="empty" style="margin:0">Dein Platz: <b style="color:var(--ink)">${pick.mine!=null?"Platz "+(pick.mine+1):"–"}</b> · Gast: <b style="color:var(--ink)">${pick.guest!=null?"Platz "+(pick.guest+1):"–"}</b></p>`;
function chipSVG(x,y,col,tc,label,o={}){
  // edler Platz-Chip: Messingrand, Chip-Einlagen, Messing-Inlay, Pik-Ornament
  const seg=(2*Math.PI*18.5/16).toFixed(2);
  let g=`<circle class="halo" cx="${x}" cy="${y}" r="25" fill="${col}"/>`;
  g+=`<circle cx="${x}" cy="${y}" r="20.5" fill="var(--brass)"/>`;
  g+=`<circle class="core" cx="${x}" cy="${y}" r="18.5" fill="${col}"/>`;
  g+=`<circle cx="${x}" cy="${y}" r="18.5" fill="none" stroke="#FFF7E4" stroke-width="3.2" stroke-dasharray="${seg} ${seg}" opacity=".85"/>`;
  g+=`<circle cx="${x}" cy="${y}" r="14" fill="${col}" stroke="var(--brass)" stroke-width="1.4"/>`;
  g+=`<text x="${x}" y="${y-5}" text-anchor="middle" font-size="6.5" fill="${tc}" opacity=".7">♠</text>`;
  g+=`<text x="${x}" y="${y+6.5}" text-anchor="middle" font-size="10" font-weight="800" fill="${tc}">${label}</text>`;
  if(o.me) g+=`<circle cx="${x}" cy="${y}" r="23" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  return g;
}
function status(d){
  const u=used(d);
  if(d.result&&d.result.done) return {c:"b-table",t:"Turnier beendet"};
  if(!active(d)) return {c:"b-free",t:"Raum frei"};
  if(u>=SEATS) return {c:"b-full",t:"Tisch voll"};
  if(u>=6) return {c:"b-table",t:"Turnier steht"};
  return {c:"b-plan",t:"Turnier geplant"};
}
function roleOf(d,m){
  for(const h of d.hosts){ if(h.m===m) return {r:"host",h}; if(h.guests.includes(m)) return {r:"guest",h}; }
  for(const p of solo(d)) if(p.m===m) return {r:"player",p};
  if(hasDealer(d)&&d.dealer===m) return {r:"dealer"};
  if(d.wait.includes(m)) return {r:"wait"};
  return null;
}
function now(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function log(x){S.feed.unshift({t:now(),x});S.feed=S.feed.slice(0,12)}
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2600)}
function dateLabel(k){const d=new Date(k+"T00:00");return `${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`}

function promote(k){
  const d=S.days[k];
  while(d.wait.length&&used(d)<SEATS){
    const slot=d.hosts.find(h=>h.release&&h.guests.length<GUESTS_PER_HOST); if(!slot) break;
    const m=d.wait.shift(); slot.guests.push(m);
    log(`${nm(m)} ist automatisch von der Warteliste an den Tisch nachgerückt – WhatsApp verschickt`);
  }
  while(d.wait.length&&!startedDay(k,d)){
    const f=freeSeatList(d); if(!f.length) break;
    const m=d.wait.shift(); solo(d).push({m,seat:f[0]});
    log(`${nm(m)} ist automatisch von der Warteliste auf Platz ${f[0]+1} nachgerückt – WhatsApp verschickt`);
  }
}
const st0=m=>S.stats[m]=S.stats[m]||{wins:0,nights:0,hosted:0};
let AWARD_MON=curMon; // Monat des Abends, für den gerade Punkte vergeben werden
const addPts=(m,p)=>{const o=S.points[AWARD_MON]||(S.points[AWARD_MON]={});o[m]=(o[m]||0)+p;st0(m)};      // Spieler-Rangliste
const addPPts=(m,p)=>{const o=S.ppoints[AWARD_MON]||(S.ppoints[AWARD_MON]={});o[m]=(o[m]||0)+p;st0(m)};  // Gastgeber-Rangliste
const att=d=>d.att||(d.att={});
const isPresent=(d,m)=>!!(d.att&&d.att[m]&&d.att[m].in);
function award(k){
  // Turnierplätze: nur die ersten 10 bekommen Punkte (Spieler-Rangliste)
  const d=S.days[k], order=d.result.out, n=order.length; AWARD_MON=k.slice(0,7);
  order.forEach((m,i)=>{const place=n-i;if(place<=10)addPts(m,PLACE_PTS[place-1]);S.stats[m].nights++;if(place===1)S.stats[m].wins++});
  // Gastgeber: 10 Punkte, +5 wenn der eigene Gast wirklich da war (Gastgeber-Rangliste)
  d.hosts.forEach(h=>{st0(h.m);S.stats[h.m].hosted=(S.stats[h.m].hosted||0)+1});
  d.wait.forEach(m=>{st0(m);S.stats[m].nights++});
  log(`Turnier beendet – Sieger ${nm(order[n-1])}. Punkte für ${Math.min(n,10)} Spieler und ${d.hosts.length} Gastgeber gutgeschrieben`);
}
// Anwesenheits-Bonus: je volle Stunde 1 Punkt, höchstens 5 (ab 5 Stunden)

const BAR_BG=(()=>{
  const W=420,H=300,cols=["#E0A146","#4F8A4B","#9E2B35","#D9D2C3","#C47A2C","#2E5E7A"];

      const tall=48+rnd()*30, w=13+rnd()*6, c=cols[Math.floor(rnd()*cols.length)], neck=tall*.32, nw=w*.32;

         `<path d="M${bx+w/2-nw/2} ${by+4} h${nw} v${neck-6} q${(w-nw)/2} 2 ${(w-nw)/2} 8 h-${w} q0 -6 ${(w-nw)/2} -8 z" fill="${c}" fill-opacity=".6"/>`+

         `<rect x="${bx+2}" y="${by+neck+6}" width="${w*.28}" height="${tall-neck-12}" rx="1.5" fill="url(#sh)"/>`+

function tickCD(){

  const s=Math.floor(ms/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;

function myGames(m){
  const out=[];
  for(const dt of dates){
    const k=key(dt), d=S.days[k]; if(!d||(d.result&&d.result.done)) continue;
    const r=roleOf(d,m);
    if(r){
      if(r.r==="host") out.push({k,d,seat:`Platz ${r.h.seat+1}`,st:"Reserviert mit Gast",c:"ok"});
      else if(r.r==="player") out.push({k,d,seat:`Platz ${r.p.seat+1}`,st:"Reserviert",c:"ok"});
      else if(r.r==="guest") out.push({k,d,seat:`Platz ${r.h.gseat+1}`,st:"Reserviert",c:"ok"});
      else if(r.r==="dealer") out.push({k,d,seat:"Geberstuhl",st:"Kartengeber",c:"ok"});
      else if(r.r==="wait") out.push({k,d,seat:"",st:`Warteliste ${d.wait.indexOf(m)+1}`,c:"wt"});

/* ================= Gemeinsamer Speicher: laden, speichern, aktuell halten ================= */
let snap=null, pushing=false, pending=false;
document.addEventListener("click",()=>{snap=ME?sharedJSON():null},true);
document.addEventListener("keydown",()=>{snap=ME?sharedJSON():null},true);
function afterAction(){ if(snap!=null&&sharedJSON()!==snap){snap=null;pushNow()} else snap=null }
document.addEventListener("click",()=>setTimeout(afterAction,0));
document.addEventListener("keydown",()=>setTimeout(afterAction,0));
function syncDot(ok){const s=document.getElementById("sync");if(s){s.classList.toggle("off",!ok);s.title=ok?"Verbunden":"Keine Verbindung"}}
async function pushNow(){
  if(pushing){pending=true;return}
  pushing=true;
  try{
    const data={}; SHARED.forEach(k=>data[k]=S[k]);
    const r=await rpc("m2r_save",{p_token:TOKEN,p_version:VERSION,p_data:data});
    syncDot(true);
    if(r.ok) VERSION=r.version;
    else if(r.conflict){VERSION=r.version;applyShared(r.state);openForm=null;pick={mine:null,guest:null};render();toast("Gerade hat jemand anderes etwas geändert. Bitte nochmal tippen.")}
    else if(r.auth){setToken(null);ME=null;showLogin("Bitte melde dich neu an.")}
    else toast(r.msg||"Speichern hat nicht geklappt");
  }catch(e){syncDot(false);toast("Keine Verbindung – deine Änderung ist nicht gespeichert.");pull(true)}
  pushing=false;
  if(pending){pending=false;pushNow()}
}
async function pull(force){
  if(!TOKEN) return;
  const busy=openForm||(document.activeElement&&["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName));
  if(!force&&(busy||pushing)) return;
  try{
    const r=await rpc("m2r_load",{p_token:TOKEN});
    syncDot(true);
    if(!r.ok){if(r.auth){setToken(null);ME=null;showLogin("Bitte melde dich neu an.")}return}
    if(r.me.setup){showSetup(r.me.nr);return}
    const changed=!ME||r.version!==VERSION||JSON.stringify(r.members)!==pull.lastM||JSON.stringify(r.admin)!==pull.lastA;
    ME=r.me; S.me=ME.nr-1; ADMIN=r.admin||null; setMembers(r.members); pull.lastM=JSON.stringify(r.members); pull.lastA=JSON.stringify(r.admin);
    if(r.version!==VERSION||!Object.keys(S.days).length){VERSION=r.version;applyShared(r.state)}
    hideLogin();
    if(changed||force){render()}
    if(remindTick()) pushNow();
  }catch(e){syncDot(false)}
}
setInterval(()=>{if(document.visibilityState==="visible")pull(false)},8000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull(false)});

/* ================= Anmeldung ================= */
const L=()=>document.getElementById("loginbody");
function hideLogin(){document.getElementById("login").classList.remove("show")}
function showLogin(msg){
  document.getElementById("login").classList.add("show");
  L().innerHTML=`<h2>Anmelden</h2><p class="empty">Mit deiner Nummer und deiner PIN.</p>
  <form class="form" id="lf" autocomplete="off"><input id="lnr" class="search big" inputmode="numeric" maxlength="3" placeholder="Deine Nummer" aria-label="Deine Nummer" required>
  <input id="lpin" class="search big" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" aria-label="PIN, 4 Ziffern" required>
  <p class="err" id="lerr">${msg||""}</p><button class="btn btn-host" id="lbtn">Anmelden</button></form>`;
  document.getElementById("lnr").focus();
  document.getElementById("lf").onsubmit=async e=>{
    e.preventDefault();
    const nr=parseInt(document.getElementById("lnr").value,10), pin=document.getElementById("lpin").value.trim(), err=document.getElementById("lerr"), b=document.getElementById("lbtn");
    if(!(nr>=1&&nr<=GEBER_MAX)){err.textContent="Bitte deine Nummer eingeben, z. B. 008.";return}
    if(!/^\d{4}$/.test(pin)){err.textContent="Die PIN hat 4 Ziffern.";return}
    b.disabled=true; err.textContent="";
    try{
      const r=await rpc("m2r_login",{p_nr:nr,p_pin:pin});
      if(!r.ok){err.textContent=r.msg;b.disabled=false;return}
      setToken(r.token);
      if(r.setup) showSetup(nr); else await pull(true);
    }catch(x){err.textContent="Keine Verbindung. Bitte nochmal versuchen.";b.disabled=false}
  };
}
function showSetup(nr){
  const nrs=nr?String(nr).padStart(3,"0"):"";
  document.getElementById("login").classList.add("show");
  L().innerHTML=`<h2>Willkommen!</h2><p class="empty">Das ist deine erste Anmeldung. Such dir eine eigene PIN aus. Einen Spitznamen kannst du dir geben – oder einfach deine Nummer behalten.</p>
  <form class="form" id="sf" autocomplete="off"><label>Spitzname (den sehen die anderen)<input id="snick" class="search" maxlength="20" placeholder="z. B. Ass-König" value="${nrs}"></label>
  <label>Neue PIN (4 Ziffern, nicht 0000)<input id="spin" class="search big" type="password" inputmode="numeric" maxlength="4" placeholder="••••" required></label>
  <label>PIN nochmal<input id="spin2" class="search big" type="password" inputmode="numeric" maxlength="4" placeholder="••••" required></label>
  <p class="err" id="serr"></p><button class="btn btn-host" id="sbtn">Speichern und los</button></form>`;
  document.getElementById("snick").focus();
  document.getElementById("sf").onsubmit=async e=>{
    e.preventDefault();
    const nick=(document.getElementById("snick").value.trim()||nrs), p1=document.getElementById("spin").value.trim(), p2=document.getElementById("spin2").value.trim(), err=document.getElementById("serr"), b=document.getElementById("sbtn");
    if(nick.length<2){err.textContent="Der Spitzname braucht mindestens 2 Zeichen.";return}
    if(!/^\d{4}$/.test(p1)||p1==="0000"){err.textContent="Die PIN muss 4 Ziffern haben und darf nicht 0000 sein.";return}
    if(p1!==p2){err.textContent="Die beiden PINs sind nicht gleich.";return}
    b.disabled=true; err.textContent="";
    try{
      const r=await rpc("m2r_setup",{p_token:TOKEN,p_pin:p1,p_nick:nick});
      if(!r.ok){err.textContent=r.msg;b.disabled=false;return}
      toast("Fertig! Merk dir deine PIN."); await pull(true);
    }catch(x){err.textContent="Keine Verbindung. Bitte nochmal versuchen.";b.disabled=false}
  };
}
if(TOKEN) pull(true).then(()=>{if(!ME&&!document.getElementById("login").classList.contains("show"))showLogin()}); else showLogin();
</script>
